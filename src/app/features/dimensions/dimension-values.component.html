<div class="bg-white rounded-lg shadow-lg border border-gray-200 p-6 h-full">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-semibold text-gray-800">Dimension Values</h2>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="createValue()"
      [disabled]="!dimensionId"
      class="flex items-center gap-2">
      <mat-icon>add</mat-icon>
      Add Value
    </button>
  </div>
  
  <!-- Loading state -->
  <div *ngIf="loading" class="flex justify-center py-12">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  
  <!-- No dimension selected -->
  <div *ngIf="!loading && !dimensionId" class="text-center py-12">
    <mat-icon class="text-gray-400 text-5xl mb-4">select_all</mat-icon>
    <p class="text-gray-500 text-lg">Select a dimension to view its values</p>
  </div>
  
  <!-- Empty state -->
  <div *ngIf="!loading && dimensionId && dimensionValues.length === 0" class="text-center py-12">
    <mat-icon class="text-gray-400 text-5xl mb-4">list</mat-icon>
    <p class="text-gray-500 mb-6 text-lg">No values found for this dimension</p>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="createValue()">
      Create First Value
    </button>
  </div>
  
  <!-- Values list -->
  <div *ngIf="!loading && dimensionId && dimensionValues.length > 0" class="space-y-3">
    <div 
      *ngFor="let value of dimensionValues" 
      class="p-4 rounded-lg bg-gray-50 hover:bg-gray-100 transition-all duration-200 border border-gray-200 hover:shadow-md"
    >
      <div class="flex items-center justify-between">
        <div class="flex-1">
          <div class="flex items-center gap-3">
            <span class="text-base font-medium text-gray-900">{{ value.text }}</span>
            <span class="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded-full">ID: {{ value.id }}</span>
            <!-- Group of Companies indicator -->
            <span 
              *ngIf="isGroupOfCompanies(value)" 
              class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-100 text-blue-800"
              matTooltip="Special value representing Group of Companies">
              <mat-icon class="text-xs mr-1">info</mat-icon>
              Group
            </span>
          </div>
        </div>
        <div class="flex space-x-1">
          <button 
            mat-icon-button 
            color="primary" 
            (click)="editValue(value)"
            class="text-gray-400 hover:text-blue-600">
            <mat-icon>edit</mat-icon>
          </button>
          <button 
            mat-icon-button 
            color="warn" 
            (click)="deleteValue(value)"
            [disabled]="isGroupOfCompanies(value)"
            [matTooltip]="isGroupOfCompanies(value) ? 'Cannot delete Group of Companies' : 'Delete value'"
            class="text-gray-400 hover:text-red-600 disabled:opacity-50">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
