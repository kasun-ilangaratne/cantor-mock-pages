<div class="bg-white rounded-lg shadow-lg border border-gray-200 p-6 h-full">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-semibold text-gray-800">Dimensions</h2>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="createDimension()"
      [disabled]="!canAddDimension"
      class="flex items-center gap-2">
      <mat-icon>add</mat-icon>
      Add Dimension
    </button>
  </div>
  
  <!-- Loading state -->
  <div *ngIf="loading" class="flex justify-center py-12">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  
  <!-- Empty state -->
  <div *ngIf="!loading && dimensions.length === 0" class="text-center py-12">
    <mat-icon class="text-gray-400 text-5xl mb-4">folder_open</mat-icon>
    <p class="text-gray-500 mb-6 text-lg">No dimensions found</p>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="createDimension()"
      [disabled]="!canAddDimension">
      Create First Dimension
    </button>
  </div>
  
  <!-- Dimensions list -->
  <div *ngIf="!loading && dimensions.length > 0" class="space-y-3">
    <div 
      *ngFor="let dimension of dimensions" 
      class="p-4 rounded-lg cursor-pointer transition-all duration-200 border-2 hover:shadow-md group"
      [class.border-blue-300]="selectedId === dimension.id"
      [class.bg-blue-50]="selectedId === dimension.id"
      [class.border-gray-200]="selectedId !== dimension.id"
      [class.bg-white]="selectedId !== dimension.id"
      [class.hover:border-gray-300]="selectedId !== dimension.id"
      (click)="selectDimension(dimension.id)"
    >
      <div class="flex items-center justify-between">
        <div class="flex-1">
          <div class="flex items-center gap-3">
            <span class="text-base font-medium text-gray-900">{{ dimension.name }}</span>
            <span class="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded-full">#{{ dimension.id }}</span>
          </div>
        </div>
        <div class="flex space-x-1 opacity-0 group-hover:opacity-100 transition-opacity">
          <button 
            mat-icon-button 
            color="primary" 
            (click)="editDimension(dimension)"
            class="text-gray-400 hover:text-blue-600">
            <mat-icon>edit</mat-icon>
          </button>
          <button 
            mat-icon-button 
            color="warn" 
            (click)="deleteDimension(dimension)"
            class="text-gray-400 hover:text-red-600">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Max dimensions warning -->
  <div *ngIf="!canAddDimension" class="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
    <div class="flex items-center">
      <mat-icon class="text-yellow-600 mr-3">warning</mat-icon>
      <span class="text-sm text-yellow-800 font-medium">
        Maximum of 11 dimensions reached
      </span>
    </div>
  </div>
</div>
