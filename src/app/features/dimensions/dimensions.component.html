<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-7xl mx-auto">
    <app-page-header title="Dimensions"></app-page-header>

    <div class="mb-8">
      <div class="flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center">
        <div class="flex items-center gap-4">
          <button 
            mat-raised-button 
            color="primary" 
            (click)="exportToPDF()"
            class="flex items-center gap-2">
            <mat-icon>picture_as_pdf</mat-icon>
            Export PDF
          </button>
          <button 
            mat-raised-button 
            color="accent" 
            (click)="exportToExcel()"
            class="flex items-center gap-2">
            <mat-icon>table_chart</mat-icon>
            Export Excel
          </button>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Left: Dimensions -->
      <div class="w-full">
        <app-dimension-list
          (select)="onDimensionSelect($event)">
        </app-dimension-list>
      </div>

      <!-- Right: Dimension Values -->
      <div class="w-full">
        <app-dimension-values
          [dimensionId]="selectedId">
        </app-dimension-values>
      </div>
    </div>
  </div>
</div>
