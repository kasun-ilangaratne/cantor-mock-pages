<div class="confirm-dialog">
  <h2 mat-dialog-title class="dialog-title">{{ data.title }}</h2>

  <mat-dialog-content class="dialog-content">
    <p>{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="dialog-actions">
    <button type="button" class="cancel-btn" (click)="onCancel()">Avbryt</button>
    <button type="button" class="confirm-btn" (click)="onConfirm()">Bekreft</button>
  </mat-dialog-actions>
</div>
