<div class="copy-dialog">
  <h2 mat-dialog-title class="dialog-title">Kopier rapportoppsett</h2>

  <mat-dialog-content class="dialog-content">
    <div class="copy-grid">
      <div>
        <div class="section-label">Kopier variabler:</div>
        <label><input type="checkbox" [(ngModel)]="variables.generelle"> Generelle</label>
        <label><input type="checkbox" [(ngModel)]="variables.kontantstrom"> Kontantstrøm inkl. pant mv</label>
        <label><input type="checkbox" [(ngModel)]="variables.regnskapsanalyse"> Regnskapsanalyse</label>
        <label><input type="checkbox" [(ngModel)]="variables.grafvariabler"> Grafvariabler</label>
        <label><input type="checkbox" [(ngModel)]="variables.notevariabler"> Notevariabler</label>
      </div>

      <div class="mode-box">
        <label><input type="radio" name="copyMode" value="add" [(ngModel)]="copyMode"> Legg til nye</label>
        <label><input type="radio" name="copyMode" value="replace" [(ngModel)]="copyMode"> Erstatt alle</label>
      </div>
    </div>

    <p class="instruction">Velg hvilke firma det skal kopieres til her:</p>
    <div class="company-list" *ngIf="selectedCompanies.length">
      <div class="selected-company" *ngFor="let company of selectedCompanies">
        <span>{{ company.nr }} {{ company.name }}</span>
        <button type="button" class="remove-btn" (click)="removeCompany(company.nr)" aria-label="Fjern firma">×</button>
      </div>
    </div>
    <p class="empty-companies" *ngIf="!selectedCompanies.length">Ingen firma valgt.</p>
    <div class="company-action">
      <button type="button" class="btn-save" (click)="openCompanyPicker()">Til flere firma</button>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button type="button" class="btn-save" (click)="onApply()">Bruk</button>
    <button type="button" class="btn-cancel" (click)="onCancel()">Avbryt</button>
  </mat-dialog-actions>
</div>
